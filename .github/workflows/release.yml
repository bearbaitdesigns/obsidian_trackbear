name: Release

# Push a tag that matches the version in manifest.json (e.g. `1.1.0`, no "v")
# and this workflow builds the plugin and publishes a GitHub release with the
# files Obsidian (and BRAT) need: main.js, manifest.json, styles.css.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check tag matches manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Package
        run: |
          mkdir -p trackbear-stats
          cp main.js manifest.json styles.css trackbear-stats/
          zip -r "trackbear-stats-$TAG.zip" trackbear-stats

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css "trackbear-stats-$TAG.zip" --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css "trackbear-stats-$TAG.zip" \
              --title "$TAG" --generate-notes
          fi
