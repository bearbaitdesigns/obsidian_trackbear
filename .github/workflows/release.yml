name: Release

# Three ways to release:
#  1. Bump the version in manifest.json and push to main. If that version has
#     no release yet, it's tagged and released automatically.
#  2. Push a tag that matches manifest.json's version (e.g. `1.1.0`, no "v").
#  3. Actions tab → Release → Run workflow. Leave "version" blank to use the
#     version in manifest.json; the tag is created automatically if missing.
# Either way the release gets main.js, manifest.json, styles.css (what Obsidian
# and BRAT need) plus a zip of the three.
on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank = manifest.json version)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # manifest.json changed on main: release its version if it's new
            TAG="$MANIFEST"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            TAG="${{ github.event.inputs.version }}"
            TAG="${TAG:-$MANIFEST}"
            # releasing an existing tag: build exactly what it points at
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              git checkout -q "refs/tags/$TAG"
              MANIFEST=$(node -p "require('./manifest.json').version")
            fi
          fi
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::Version $TAG does not match manifest.json version $MANIFEST"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.v.outputs.skip != 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        if: steps.v.outputs.skip != 'true'
        run: npm run build

      - name: Package
        if: steps.v.outputs.skip != 'true'
        run: |
          mkdir -p trackbear-stats
          cp main.js manifest.json styles.css trackbear-stats/
          zip -r "trackbear-stats-${{ steps.v.outputs.tag }}.zip" trackbear-stats

      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          FILES="main.js manifest.json styles.css trackbear-stats-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            # --target creates the tag at this commit if it doesn't exist yet
            gh release create "$TAG" $FILES --target "$SHA" --title "$TAG" --generate-notes
          fi
